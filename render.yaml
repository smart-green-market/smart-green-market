# Blueprint Render — Web Service (ASGI + WebSocket) + PostgreSQL + Key Value (Redis)
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: smart-green-market-db
    databaseName: smart_green_market
    user: smart_green_market
    plan: free

services:
  - type: keyvalue
    name: smart-green-market-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: smart-green-market-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-green-market-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: smart-green-market-redis
          type: keyvalue
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false

  - type: web
    name: smart-green-market-web
    runtime: static
    plan: free
    rootDir: frontend/web-site
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smart-green-market-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
