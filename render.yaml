# Blueprint Render — tạo Web Service + PostgreSQL free tier
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: smart-green-market-db
    databaseName: smart_green_market
    user: smart_green_market
    plan: free

services:
  - type: web
    name: smart-green-market-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-green-market-db
          property: connectionString
